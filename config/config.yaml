# ============================================================
# Agentic RAG 统一配置文件
# 所有模块通过此文件启停 / 替换，无需改代码
# ============================================================

# ---------- 文档处理 ----------
document:
  parsers: [pdf, markdown, html, docx]      # 启用的解析器，按需增减
  chunking:
    strategy: recursive                     # recursive / semantic / parent_child
    chunk_size: 500
    overlap: 50

# ---------- 检索（核心可插拔点）----------
retriever:
  mode: bm25                                # vector / bm25 / hybrid（阶段1先用bm25，无需embedding模型）
  vector:
    provider: faiss                         # faiss / qdrant / chroma
    embedding: sentence-transformers        # sentence-transformers / bge-m3 / openai
    embedding_model: all-MiniLM-L6-v2       # 仅 sentence-transformers / bge-m3 生效
    top_k: 5
  bm25:
    provider: rank_bm25
    top_k: 3
  fusion:
    method: rrf                             # rrf / weighted
    rrf_k: 60

# ---------- Rerank ----------
reranker:
  enabled: false                            # 阶段1先关闭，阶段2开启
  provider: bge-reranker
  top_k: 5

# ---------- Agent 工作流 ----------
agent:
  enabled: false                            # 阶段1先关闭（退化为朴素 RAG），阶段2开启
  intent_routing: true
  max_iterations: 3
  relevance_threshold: 0.7
  hitl_clarify: true
  web_search: false

# ---------- LLM ----------
llm:
  provider: openai                          # openai / qwen / ollama（均走 OpenAI 兼容接口）
  model: LongCat-2.0                        # LongCat-2.0 / gpt-4o-mini / qwen-plus
  temperature: 0.2
  streaming: true
  thinking: false                           # LongCat-2.0 思考过程：false 关闭(阶段1快答) / true 开启(阶段2可视化)

# ---------- 前端功能开关 ----------
frontend:
  features: [chat, sources, upload, config_panel, eval_panel, trace_panel]
  streaming: true
  theme: light
